name: Typecheck

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  typecheck-webapp:
    name: "tsc: webapp"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install root + webapp deps
        run: bun install
      - name: Typecheck webapp
        working-directory: webapp
        # continue-on-error: false so this genuinely gates merges.
        # Land red-but-reporting if tree is not clean; the gate still reports.
        run: bun run typecheck

  typecheck-backend:
    name: "tsc: backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install root + backend deps
        run: bun install && cd backend && bun install
      - name: Typecheck backend
        working-directory: backend
        run: bun run typecheck

  typecheck-alts:
    name: "tsc: apps/alts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install all deps
        run: bun install
      - name: Typecheck alts
        working-directory: apps/alts
        run: bun run typecheck

  test-metrics-drift:
    name: "test: metrics + format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install root + backend deps
        run: bun install && cd backend && bun install
      - name: Backend unit tests (metrics drift + QC)
        working-directory: backend
        run: bun test src/lib/metrics.test.ts src/lib/metrics.drift.test.ts src/lib/qc.test.ts
      - name: Date format tests
        working-directory: packages/design
        run: bun test src/format.test.ts
      - name: Pickup bag math
        working-directory: apps/alts
        run: bun test src/lib/pickupBag.test.ts

  test-alts:
    name: "test: apps/alts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install all deps
        run: bun install
      - name: Unit tests
        working-directory: apps/alts
        run: bun test src

  e2e-alts:
    name: "playwright: apps/alts smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install all deps
        run: bun install
      - name: Install Chromium
        working-directory: apps/alts
        run: bunx playwright install --with-deps chromium
      - name: Smoke suite
        working-directory: apps/alts
        env:
          CI: "1"
          VITE_COMMIT: ${{ github.sha }}
        run: bunx playwright test
