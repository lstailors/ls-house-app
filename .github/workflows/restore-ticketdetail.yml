name: restore-ticketdetail

on:
  push:
    branches:
      - cursor/pepe-chat-panel-5e5b
    paths:
      - ".github/workflows/restore-ticketdetail.yml"
      - "apps/alts/src/pages/intake/ticketdetail-pepe.patch"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/pepe-chat-panel-5e5b
          fetch-depth: 0
      - name: Restore full TicketDetail.tsx
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:apps/alts/src/pages/intake/TicketDetail.tsx > apps/alts/src/pages/intake/TicketDetail.tsx
          git apply --whitespace=nowarn apps/alts/src/pages/intake/ticketdetail-pepe.patch
          got=$(git hash-object apps/alts/src/pages/intake/TicketDetail.tsx)
          test "$got" = "7ecaac57c16357916ad3ffcf166d4106f3553af4"
          rm -f apps/alts/src/pages/intake/ticketdetail-pepe.patch
          rm -f .github/workflows/restore-ticketdetail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/alts/src/pages/intake/TicketDetail.tsx
          git add -u
          git commit -m "Restore full TicketDetail.tsx with Ask Pepe action"
          git push origin HEAD:cursor/pepe-chat-panel-5e5b
